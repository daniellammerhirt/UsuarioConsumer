<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, shrink-to-fit=no">
    <title>Informações</title>
    <link rel="stylesheet" href="/style.css">
    <script src="http://unpkg.com/lucide@latest"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function (){
            lucide.createIcons();
        })
    </script>
</head>
<body>

<navbar>
    <a th:href="@{/usuario/info}">Informações</a>
    <a th:href="@{new}">Novo</a>
    <a th:href="@{/usuario}">Usuários</a>
</navbar>



<table>
    <thead>
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Data de Nascimento</th>
        <th>Actions</th>
    </tr>
    </thead>


    <tr th:each="usuarioInfo : ${listUsuarioInfo}">
        <td th:text="${usuarioInfo.nome}"/>
        <td th:text="${usuarioInfo.email}"/>
        <td th:text="${usuarioInfo.dataNascimento}"/>
        <td>
            <a th:href="@{'/usuario/' + ${usuarioInfo.usuarioId} + '/edit'}"><i data-lucide="user-round-pen"></i>Editar</a>
            <a th:href="@{'/usuario/' + ${usuarioInfo.usuarioId} + '/delete'}" onclick="if (!(confirm('Tem certeza que deseja excluir'))) return false"><i data-lucide="user-round-x"></i>Deletar</a>
        </td>
    </tr>
</table>
</body>
</html>
